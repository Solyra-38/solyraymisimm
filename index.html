async function shrink(f,m){const b=await createImageBitmap(f),k=Math.min(1,m/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,"image/jpeg",.85))}

async function saveProf(){const n=$("#pn").value.trim();if(!n)return;const r=await sb.from("profiles").update({username:n}).eq("id",me.id);toast(r.error?r.error.message:"Kaydedildi");route()}
async function saveSite(){const r=await sb.from("site").update({author:$("#s1").value,bio:$("#s2").value,tags:$("#s3").value.split(",").map(x=>x.trim()).filter(Boolean),font:$("#s4").value}).eq("id",1);if(!r.error)applyFont($("#s4").value);toast(r.error?r.error.message:"Kaydedildi")}
async function addAnn(){const m=$("#an").value.trim();if(!m)return;const r=await sb.from("announcements").insert({message:m});if(r.error)return toast(r.error.message);route()}
async function delAnn(id){await sb.from("announcements").delete().eq("id",id);route()}
async function route(){const h=location.hash.slice(1).split("-"),t=h[0],adminR=["admin","ab","ac","ar","ad","ai","yorum"].includes(t);$("#sel").style.display="none";
if(t!="yorum"){window.LCT=0;YN=100}if(t!="book"&&t!="read")document.documentElement.style.cssText="";document.body.classList.toggle("night",!!S.night);document.documentElement.className="pg-"+(t=="book"?"book":t=="read"||adminR||t=="fav"||t=="cal"||t=="diary"||t=="dp"||t=="bil"||t=="profil"?"read":"home")+((t=="book"||t=="read")&&document.documentElement.classList.contains("pal")?" pal":"");
try{if(adminR&&!adm){app.innerHTML=`<div class="w">${bar()}<p>Bu alan yalnızca yazar içindir.</p><button class="btn" onclick="go('home')">Ana sayfa</button></div>`;return}
if(t=="book")await book(h[1]);else if(t=="read")await read(h[1]);else if(t=="fav")await favs();else if(t=="bil")await bil();else if(t=="profil")await profil();else if(t=="cal")await cal();else if(t=="diary")await diary();else if(t=="dp")await dpost(h[1]);else if(t=="admin")await admin();
else if(t=="ab")await edit("books",h[1]);else if(t=="ac")await(h[1]=="new"?edit("chapters","new",+h[2]):edit("chapters",h[1]));
else if(t=="ar")await(h[1]=="new"?edit("characters","new",+h[2]):edit("characters",h[1]));else if(t=="ad")await edit("diary_posts",h[1]);else if(t=="ai")await edit("ideas",h[1]);else if(t=="yorum")await yorum();else await home()}
catch(e){app.innerHTML=`<div class="w"><p>Bir sorun oluştu: ${esc(e.message)}</p></div>`}if(nf){nf=0;app.classList.remove("fade");void app.offsetWidth;app.classList.add("fade")}refreshUN()}
addEventListener("hashchange",()=>{nf=1;scrollTo(0,0);route()});
load().then(route);sb.from("site").select("font").eq("id",1).maybeSingle().then(x=>applyFont(x.data&&x.data.font));
</script></body></html>
